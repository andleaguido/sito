<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="color-scheme" content="light dark">
<title>andleaguido — in arrivo</title>
<style>
:root { --fondo: #faf8f5; --testo: #1d1b19; --tenue: #625d57; --accento: #9a5a22; }
@media (prefers-color-scheme: dark) { :root { --fondo: #141210; --testo: #f1ede8; --tenue: #a39b92; --accento: #e2a066; } }
html, body { height: 100%; margin: 0; }
body { display: flex; align-items: center; justify-content: center; padding: 0 16px; background: var(--fondo); color: var(--testo); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
h1 { font-size: clamp(1.8rem, 7vw, 3rem); font-weight: 700; letter-spacing: -.02em; margin: 0 0 .5rem; }
p { margin: 0; color: var(--tenue); font-size: clamp(1rem, 3.5vw, 1.2rem); }
span { color: var(--accento); font-weight: 600; }
main { max-width: 32rem; }
p + p { margin-top: .4rem; }
</style>
</head>
<body>
<main>
<h1>andleaguido</h1>
<p>Software costruito con cura, in Italia.</p>
<p><span>In arrivo.</span></p>
</main>
</body>
</html>
